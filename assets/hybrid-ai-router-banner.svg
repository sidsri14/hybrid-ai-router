<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid decoration -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Title Badge -->
  <rect x="100" y="90" width="280" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="240" y="114" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">GOOGLE #BUILDHYBRIDAI 2026</text>

  <!-- Main Headline -->
  <text x="100" y="210" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800">
    Hybrid AI Router
  </text>
  <text x="100" y="260" fill="url(#primary)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600">
    Zero-Cost On-Device First with Cloud Escalation &amp; Circuit Breaker
  </text>

  <!-- Subtitle / Metrics -->
  <text x="100" y="320" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
    Intelligently partitions inference between on-device SLMs (Gemma 2B) and Google Gemini cloud.
  </text>

  <!-- Stat Cards -->
  <!-- Card 1 -->
  <g transform="translate(100, 380)">
    <rect width="220" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="50" fill="url(#accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800">-68.4%</text>
    <text x="24" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">Cloud API Spend</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(350, 380)">
    <rect width="220" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="50" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800">&lt;30ms</text>
    <text x="24" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">On-Device Latency</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(600, 380)">
    <rect width="220" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="50" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800">100%</text>
    <text x="24" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">Offline Resilience</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(850, 380)">
    <rect width="220" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="50" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800">0 PII</text>
    <text x="24" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">Cloud Data Leakage</text>
  </g>

  <!-- Footer -->
  <text x="100" y="570" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">
    Built with TypeScript 5.5+ • 11/11 Automated Unit Tests Passing • MIT Licensed • Author: Siddharth Srivastava (@sidsri14)
  </text>
</svg>
